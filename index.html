<!DOCTYPE html>
<html>
<head>
<title>Asmaa's Staff Schedule Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    padding:20px;
    margin:0;
}
.container{
    background:#ffffff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    max-width:1200px;
    margin:auto;
}
h2{ text-align:center; color:#1e3c72; margin-bottom:20px; }
h3{ margin-top:30px; color:#2a5298; }
.section{ margin-bottom:20px; }
input,select,button{
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
    margin:5px 3px;
    font-size:14px;
}
button{
    background:#1e3c72;
    color:white;
    border:none;
    cursor:pointer;
    transition:0.3s;
}
button:hover{ background:#16305c; }
table{ width:100%; border-collapse:collapse; margin-top:20px; min-width:800px; }
th{ background:#1e3c72; color:white; padding:10px; font-size:14px; }
td{ border-bottom:1px solid #ddd; padding:8px; text-align:center; font-size:13px; }
.holiday{ background:#ffe699; }
.sunday{ background:#f2f2f2; }
.leave{ background:#ffcccc; }
.halfday{ background:#c6f5c6; }
#execConfig,#scheduleArea{ overflow-x:auto; width:100%; }
.footer{ text-align:center; margin-top:20px; font-size:12px; color:#666; }
@media (max-width: 768px){
body{ padding:10px; }
.container{ padding:15px; }
input,select{ width:100%; box-sizing:border-box; }
button{ width:100%; margin-top:8px; }
.section{ display:flex; flex-direction:column; }
h2{ font-size:20px; }
h3{ font-size:16px; }
table{ font-size:12px; }
th, td{ padding:6px; }
}
</style>

<!-- jsPDF + autoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
<div class="container">
<h2>Fujairah Showroom Staff Schedule</h2>

<div class="section">
From: <input type="date" id="startDate">
To: <input type="date" id="endDate">
</div>

<h3>Asmaa Dami's Staff Schedule</h3>
<div id="execConfig"></div>

<h3>Add Public Holiday</h3>
<div class="section">
Date: <input type="date" id="holidayDate">
Name: <input type="text" id="holidayName" placeholder="Example: Christmas">
<button onclick="addHoliday()">Add Holiday</button>
</div>

<h3>Override Sunday (Make Working)</h3>
<div class="section">
Date: <input type="date" id="workingSundayDate">
<button onclick="addWorkingSunday()">Add Working Sunday</button>
</div>

<div style="text-align:center;margin-top:20px;">
<button onclick="generateSchedule()">Generate Schedule</button>
<button onclick="downloadSchedulePDF()">Export PDF</button>
</div>

<div id="scheduleArea"></div>

<div class="footer">
© Copyrights to Hesper
</div>
</div>

<script>
const executives = [
"ASMAA DAMI","EME GARDUCE","MARIA KATRINA","SAYEED BIN AMMARI",
"RICHARD SOLOMON","JUNAID ALAM"
];
const weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let holidays = [];
let workingSundays = [];

function loadExecConfig(){
let table="<table><tr><th>Name</th><th>Shift</th><th>Half Day (Weekly)</th><th>Leave From</th><th>Leave To</th></tr>";
executives.forEach((exec,i)=>{
table+=`<tr>
<td>${exec}</td>
<td><select id="shift${i}"><option>Morning</option><option>Afternoon</option></select></td>
<td><select id="halfDay${i}"><option value="">None</option>${weekdays.map((d,idx)=>`<option value="${idx}">${d}</option>`).join("")}</select></td>
<td><input type="date" id="leaveFrom${i}"></td>
<td><input type="date" id="leaveTo${i}"></td></tr>`;});
table+="</table>";
document.getElementById("execConfig").innerHTML=table;
}

function addHoliday(){
let date=document.getElementById("holidayDate").value;
let name=document.getElementById("holidayName").value;
if(date && name){ holidays.push({date,name}); alert("Holiday Added Successfully"); }
}

function addWorkingSunday(){
let date=document.getElementById("workingSundayDate").value;
if(date){ let checkDate=new Date(date);
if(checkDate.getDay()!==0){ alert("Selected date is not Sunday."); return; }
if(!workingSundays.includes(date)){ workingSundays.push(date); alert("Sunday marked as Working Day."); } }
}

let scheduleData = []; // store schedule for PDF

function generateSchedule(){
let start=new Date(document.getElementById("startDate").value);
let end=new Date(document.getElementById("endDate").value);
if(!start || !end || start>end){ alert("Invalid Date Range"); return; }

let table="<table><tr><th>Date</th>";
executives.forEach(exec=>table+=`<th>${exec}</th>`); table+="</tr>";

scheduleData = []; // reset PDF data
for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
let dateStr=d.toISOString().split("T")[0]; let day=d.getDay();
let holidayObj=holidays.find(h=>h.date===dateStr);
let isWorkingSunday=workingSundays.includes(dateStr);
let rowClass="";
if(holidayObj) rowClass="holiday"; else if(day===0 && !isWorkingSunday) rowClass="sunday";
table+=`<tr class="${rowClass}"><td>${dateStr}${holidayObj?" - "+holidayObj.name:""}</td>`;

let pdfRow = [dateStr + (holidayObj ? " - "+holidayObj.name : "")];

executives.forEach((exec,i)=>{
let cell="";
if(holidayObj){ cell="Holiday"; table+=`<td>Holiday</td>`; pdfRow.push(cell); return; }

let leaveFrom=document.getElementById(`leaveFrom${i}`).value;
let leaveTo=document.getElementById(`leaveTo${i}`).value;
if(leaveFrom && leaveTo){ let from=new Date(leaveFrom); let to=new Date(leaveTo); if(d>=from && d<=to){ cell="Leave"; table+=`<td class="leave">Leave</td>`; pdfRow.push(cell); return; } }
if(day===0 && !isWorkingSunday){ cell="Off"; table+=`<td>Off</td>`; pdfRow.push(cell); return; }

let halfDay=document.getElementById(`halfDay${i}`).value;
let shift=document.getElementById(`shift${i}`).value;
if(halfDay!=="" && parseInt(halfDay)===day){ cell=shift+" (Half Day)"; table+=`<td class="halfday">${cell}</td>`; pdfRow.push(cell); return; }
cell=shift; table+=`<td>${cell}</td>`; pdfRow.push(cell);
});
table+="</tr>"; scheduleData.push(pdfRow);
}
table+="</table>";
document.getElementById("scheduleArea").innerHTML=table;
}

function downloadSchedulePDF(){
if(scheduleData.length===0){ alert("Please generate schedule first."); return; }
const { jsPDF } = window.jspdf;
let doc = new jsPDF('l','pt','a4');
doc.setFontSize(14);
doc.text("Fujairah Showroom Staff Schedule", 40, 40);
doc.autoTable({
head: [["Date", ...executives]],
body: scheduleData,
startY: 60,
styles:{ fontSize:10, cellPadding:4 }
});
doc.save("Staff_Schedule.pdf");
}

loadExecConfig();
</script>
</body>
</html>
